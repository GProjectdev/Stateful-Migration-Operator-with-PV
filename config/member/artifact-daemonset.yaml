{
    "apiVersion":  "apps/v1",
    "kind":  "DaemonSet",
    "metadata":  {
                     "name":  "stateful-artifact",
                     "namespace":  "stateful-migration-system"
                 },
    "spec":  {
                 "selector":  {
                                  "matchLabels":  {
                                                      "app":  "stateful-artifact"
                                                  }
                              },
                 "template":  {
                                  "metadata":  {
                                                   "labels":  {
                                                                  "app":  "stateful-artifact"
                                                              }
                                               },
                                  "spec":  {
                                               "serviceAccountName":  "stateful-artifact",
                                               "nodeSelector":  {
                                                                    "kubernetes.io/os":  "linux"
                                                                },
                                               "tolerations":  [
                                                                   {
                                                                       "operator":  "Exists"
                                                                   }
                                                               ],
                                               "containers":  [
                                                                  {
                                                                      "name":  "verifier",
                                                                      "image":  "ghcr.io/gprojectdev/stateful-migration-system:dev",
                                                                      "args":  [
                                                                                   "--mode=artifact",
                                                                                   "--cluster-name=aws",
                                                                                   "--leader-elect=false",
                                                                                   "--archive-root=/host-checkpoints",
                                                                                   "--artifact-store-root=/artifact-store"
                                                                               ],
                                                                      "env":  [
                                                                                  {
                                                                                      "name":  "NODE_NAME",
                                                                                      "valueFrom":  {
                                                                                                        "fieldRef":  {
                                                                                                                         "fieldPath":  "spec.nodeName"
                                                                                                                     }
                                                                                                    }
                                                                                  }
                                                                              ],
                                                                      "securityContext":  {
                                                                                              "runAsUser":  0,
                                                                                              "allowPrivilegeEscalation":  false,
                                                                                              "readOnlyRootFilesystem":  true,
                                                                                              "capabilities":  {
                                                                                                                   "drop":  [
                                                                                                                                "ALL"
                                                                                                                            ]
                                                                                                               },
                                                                                              "seccompProfile":  {
                                                                                                                     "type":  "RuntimeDefault"
                                                                                                                 }
                                                                                          },
                                                                      "resources":  {
                                                                                        "requests":  {
                                                                                                         "cpu":  "50m",
                                                                                                         "memory":  "64Mi"
                                                                                                     },
                                                                                        "limits":  {
                                                                                                       "memory":  "256Mi"
                                                                                                   }
                                                                                    },
                                                                      "volumeMounts":  [
                                                                                           {
                                                                                               "name":  "archives",
                                                                                               "mountPath":  "/host-checkpoints",
                                                                                               "readOnly":  false
                                                                                           },
                                                                                           {
                                                                                               "name":  "artifact-store",
                                                                                               "mountPath":  "/artifact-store",
                                                                                               "readOnly":  false
                                                                                           }
                                                                                       ]
                                                                  }
                                                              ],
                                               "volumes":  [
                                                               {
                                                                   "name":  "archives",
                                                                   "hostPath":  {
                                                                                    "path":  "/var/lib/kubelet/checkpoints",
                                                                                    "type":  "DirectoryOrCreate"
                                                                                }
                                                               },
                                                               {
                                                                   "name":  "artifact-store",
                                                                   "persistentVolumeClaim":  {
                                                                                                 "claimName":  "stateful-migration-artifacts"
                                                                                             }
                                                               }
                                                           ]
                                           }
                              }
             }
}
