apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: restoreplan-interpreter
spec:
  target:
    apiVersion: migration.dcnlab.com/v1alpha1
    kind: RestorePlan
  customizations:
    statusReflection:
      luaScript: |
        local function copy(value)
          if type(value) ~= "table" then return value end
          local out = {}
          for key, item in pairs(value) do
            local copied = copy(item)
            if copied ~= nil then out[key] = copied end
          end
          if next(out) == nil then return nil end
          return out
        end
        function ReflectStatus(observedObj)
          local status = observedObj and observedObj.status
          local out = {}
          if type(status) == "table" then
            for key, value in pairs(status) do
              if key ~= "clusters" then out[key] = copy(value) end
            end
          end
          return out
        end
    statusAggregation:
      luaScript: |
        local function copy(value)
          if type(value) ~= "table" then return value end
          local out = {}
          for key, item in pairs(value) do
            local copied = copy(item)
            if copied ~= nil then out[key] = copied end
          end
          if next(out) == nil then return nil end
          return out
        end
        function AggregateStatus(desiredObj, statusItems)
          desiredObj.status = desiredObj.status or {}
          -- Never carry a previous report forward when a member stops reporting.
          desiredObj.status.clusters = nil
          local generation = desiredObj.metadata and desiredObj.metadata.generation
          if type(generation) ~= "number" or generation < 1 then return desiredObj end
          local spec = desiredObj.spec or {}
          local counts = {}
          for _, item in ipairs(statusItems or {}) do
            local name = item.clusterName
            if type(name) == "string" and name ~= "" then
              counts[name] = (counts[name] or 0) + 1
            end
          end
          local clusters = {}
          for _, item in ipairs(statusItems or {}) do
            local name = item.clusterName
            local status = item.status
            local expected = name == spec.sourceCluster or name == spec.targetCluster
            if expected and counts[name] == 1 and type(status) == "table"
                and status.observedGeneration == generation then
              local report = {clusterName = name}
              for _, key in ipairs({"observedGeneration", "phase", "message", "pods"}) do
                report[key] = copy(status[key])
              end
              table.insert(clusters, report)
            end
          end
          table.sort(clusters, function(a, b) return a.clusterName < b.clusterName end)
          -- Empty tables serialize as {}, which violates the CRD array schema.
          if #clusters > 0 then desiredObj.status.clusters = clusters end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          local status = observedObj and observedObj.status
          local generation = observedObj and observedObj.metadata and observedObj.metadata.generation
          if type(status) ~= "table" or type(generation) ~= "number" or generation < 1 then
            return false
          end
          return status.observedGeneration == generation and (status.phase == "Prepared" or status.phase == "Running")
        end
