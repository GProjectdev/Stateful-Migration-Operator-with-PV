apiVersion: v1
kind: PersistentVolume
metadata:
  name: trainer-checkpoint-0
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: fluidcr-demo
    name: checkpoint-trainer-0
  nfs:
    server: ${NFS_SERVER}
    path: ${NFS_EXPORT_0}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trainer-checkpoint-1
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: fluidcr-demo
    name: checkpoint-trainer-1
  nfs:
    server: ${NFS_SERVER}
    path: ${NFS_EXPORT_1}
