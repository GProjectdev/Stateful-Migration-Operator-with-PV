apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restoreplans.migration.dcnlab.com
spec:
  group: migration.dcnlab.com
  names:
    kind: RestorePlan
    listKind: RestorePlanList
    plural: restoreplans
    singular: restoreplan
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
            maxLength: 64
          kind:
            type: string
            maxLength: 64
          metadata:
            type: object
          spec:
            type: object
            required:
            - requestUID
            - checkpointRef
            - workloadRef
            - sourceCluster
            - targetCluster
            - sourceFenced
            - volumesReady
            - pods
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: spec is immutable after creation
            properties:
              requestUID:
                type: string
                minLength: 1
                maxLength: 128
              checkpointRef:
                type: object
                required:
                - name
                - uid
                - generation
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
                  generation:
                    type: integer
                    format: int64
                    minimum: 1
              workloadRef:
                type: object
                required:
                - apiVersion
                - kind
                - name
                x-kubernetes-validations:
                - rule: (self.apiVersion == 'apps/v1' && self.kind == 'StatefulSet') || (self.apiVersion == 'v1' && self.kind == 'Pod')
                  message: workloadRef must target apps/v1 StatefulSet or v1 Pod
                properties:
                  apiVersion:
                    type: string
                    maxLength: 16
                    enum:
                    - apps/v1
                    - v1
                  kind:
                    type: string
                    maxLength: 16
                    enum:
                    - StatefulSet
                    - Pod
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
              sourceCluster:
                type: string
                minLength: 1
                maxLength: 253
              targetCluster:
                type: string
                minLength: 1
                maxLength: 253
              sourceFenced:
                type: boolean
              volumesReady:
                type: boolean
              pods:
                type: array
                minItems: 1
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - targetPod
                items:
                  type: object
                  required:
                  - sourcePod
                  - targetPod
                  - targetNode
                  - archives
                  properties:
                    sourcePod:
                      type: string
                      minLength: 1
                      maxLength: 253
                    targetPod:
                      type: string
                      minLength: 1
                      maxLength: 253
                    targetNode:
                      type: string
                      minLength: 1
                      maxLength: 253
                    archives:
                      type: array
                      minItems: 1
                      maxItems: 1
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                      - containerName
                      items:
                        type: object
                        required:
                        - containerName
                        - sourcePath
                        - targetPath
                        - sha256
                        properties:
                          containerName:
                            type: string
                            minLength: 1
                            maxLength: 253
                          sourcePath:
                            type: string
                            minLength: 2
                            maxLength: 1024
                            pattern: ^/([A-Za-z0-9._:+-]*[A-Za-z0-9_:+-][A-Za-z0-9._:+-]*/)*[A-Za-z0-9._:+-]*[A-Za-z0-9_:+-][A-Za-z0-9._:+-]*$
                          targetPath:
                            type: string
                            minLength: 30
                            maxLength: 1024
                            pattern: ^/var/lib/kubelet/checkpoints/([A-Za-z0-9._:+-]*[A-Za-z0-9_:+-][A-Za-z0-9._:+-]*/)*[A-Za-z0-9._:+-]*[A-Za-z0-9_:+-][A-Za-z0-9._:+-]*$
                          sha256:
                            type: string
                            minLength: 64
                            maxLength: 64
                            pattern: ^[0-9a-f]{64}$
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                minimum: 0
              phase:
                type: string
                maxLength: 64
              message:
                type: string
                maxLength: 4096
              planName:
                type: string
                maxLength: 253
              artifacts:
                type: array
                maxItems: 512
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - nodeName
                items:
                  type: object
                  required:
                  - nodeName
                  - observedGeneration
                  - verified
                  - checkedAt
                  properties:
                    nodeName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    verified:
                      type: boolean
                    message:
                      type: string
                      maxLength: 4096
                    checkedAt:
                      type: string
                      format: date-time
              pods:
                type: array
                maxItems: 512
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  required:
                  - name
                  - phase
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    uid:
                      type: string
                      maxLength: 128
                    phase:
                      type: string
                      minLength: 1
                      maxLength: 64
                    message:
                      type: string
                      maxLength: 4096
              clusters:
                type: array
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - clusterName
                items:
                  type: object
                  required:
                  - clusterName
                  properties:
                    clusterName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    phase:
                      type: string
                      maxLength: 64
                    message:
                      type: string
                      maxLength: 4096
                    pods:
                      type: array
                      maxItems: 512
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                      - name
                      items:
                        type: object
                        required:
                        - name
                        - phase
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                          uid:
                            type: string
                            maxLength: 128
                          phase:
                            type: string
                            minLength: 1
                            maxLength: 64
                          message:
                            type: string
                            maxLength: 4096
