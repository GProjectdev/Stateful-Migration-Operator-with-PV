{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "stateful-checkpoint"
  },
  "rules": [
    {
      "apiGroups": [
        "fluidcr.dcnlab.com"
      ],
      "resources": [
        "fluidcrmigrations",
        "fluidcrmigrations/status",
        "fluidcrmigrations/finalizers"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "update",
        "patch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes/checkpoint"
      ],
      "verbs": [
        "create"
      ]
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "statefulsets",
        "deployments",
        "replicasets"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "batch"
      ],
      "resources": [
        "jobs"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "coordination.k8s.io"
      ],
      "resources": [
        "leases"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch"
      ]
    }
  ]
}
