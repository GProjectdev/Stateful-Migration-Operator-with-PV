{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "stateful-management",
    "namespace": "stateful-migration-system"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "stateful-management"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "stateful-management"
        }
      },
      "spec": {
        "serviceAccountName": "stateful-management",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "manager",
            "image": "ghcr.io/gprojectdev/stateful-migration-system:dev",
            "args": [
              "--mode=management",
              "--kubeconfig=/etc/karmada/kubeconfig"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "ports": [
              {
                "name": "health",
                "containerPort": 8081
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": "health"
              }
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "health"
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "karmada",
                "mountPath": "/etc/karmada",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "karmada",
            "secret": {
              "secretName": "stateful-karmada-kubeconfig"
            }
          }
        ]
      }
    }
  }
}
