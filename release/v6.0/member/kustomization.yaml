apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/member
commonAnnotations:
  architecture.dcnlab.com/display-name: "Member Checkpoint/Restore Controller"
  architecture.dcnlab.com/release: v6.0
images:
  - name: ghcr.io/gprojectdev/stateful-migration-system
    newName: docker.io/jeongseungjun/stateful-migration-system
    newTag: v6.0
patches:
  - target:
      kind: Deployment
      name: stateful-member
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --group-control-image=docker.io/jeongseungjun/fluidcr-group-control:v6.0
