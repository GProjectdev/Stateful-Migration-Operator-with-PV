name: Stateful Migration System
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: test -z "$(gofmt -l api cmd internal runtime/crio)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -B -m unittest discover -s runtime/tests -v
      - run: bash -n scripts/create-karmada-kubeconfig.sh
      - run: CGO_ENABLED=0 GOOS=linux go build ./cmd/manager
      - run: |
          for bundle in crd karmada management member checkpoint; do
            kubectl kustomize config/$bundle > /dev/null
          done
